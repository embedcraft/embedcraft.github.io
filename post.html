<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide | DigiEdge</title>
<meta name="description" content="Technical guide from the DigiEdge team.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%232f5bff'/%3E%3Cstop offset='100%25' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Helvetica,Arial,sans-serif' font-size='26' font-weight='bold' fill='white' text-anchor='middle'%3EDE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/site.css">
<script src="js/theme.js"></script>
<style>
  .post-meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;color:var(--text-dim);font-size:.85rem;margin-bottom:34px;}
  .post-meta-row .cat-badge{margin-right:2px;}
  .markdown-body{max-width:100%;line-height:1.7;font-size:1rem;}
  .markdown-body h1{text-align:center;font-size:1.6rem;font-weight:800;letter-spacing:-.4px;margin:0 0 28px;}
  .markdown-body h1 img{display:block;margin:0 auto 14px;max-width:220px;border-radius:12px;}
  .markdown-body h2{font-size:1.4rem;font-weight:800;letter-spacing:-.3px;margin:40px 0 16px;padding-top:8px;}
  .markdown-body h3{font-size:1.15rem;font-weight:700;margin:28px 0 12px;}
  .markdown-body h4,.markdown-body h5,.markdown-body h6{font-size:1rem;font-weight:700;margin:22px 0 10px;}
  .markdown-body p{margin:0 0 16px;color:var(--text);}
  .markdown-body ul,.markdown-body ol{margin:0 0 16px;padding-left:26px;}
  .markdown-body li{margin-bottom:6px;}
  .markdown-body a{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;}
  .markdown-body a:hover{color:var(--ai);}
  .markdown-body img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block;margin:18px auto;}
  .markdown-body hr{border:none;border-top:1px solid var(--line);margin:36px 0;}
  .markdown-body blockquote{border-left:3px solid var(--ai);background:var(--bg-alt);border-radius:0 8px 8px 0;padding:12px 18px;margin:0 0 18px;color:var(--text-dim);}
  .markdown-body blockquote p{margin-bottom:0;color:inherit;}
  .markdown-body code{font-family:var(--mono);background:var(--bg-alt);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-size:.85em;}
  .markdown-body pre{background:#0f172a;border-radius:10px;padding:18px;overflow-x:auto;margin:0 0 20px;}
  .markdown-body pre code{background:none;border:none;padding:0;color:#c4b5fd;font-size:.82rem;line-height:1.7;}
  .markdown-body table{width:100%;border-collapse:collapse;margin:0 0 22px;font-size:.88rem;display:block;overflow-x:auto;}
  .markdown-body th,.markdown-body td{border:1px solid var(--line);padding:8px 12px;text-align:left;}
  .markdown-body th{background:var(--bg-alt);font-weight:700;}
  .post-nav-links{display:flex;justify-content:space-between;gap:16px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .post-nav-links a{font-weight:700;}
  .post-nav-links .disabled{color:var(--text-dim);opacity:.4;pointer-events:none;font-weight:700;}
  .page-nav{margin-bottom:8px;}
  .page-nav .cat-pill.active{color:#fff;}
  @media(max-width:640px){.markdown-body table{font-size:.8rem;}}
</style>
</head>
<body>

<header>
  <div class="nav-wrap">
    <a class="logo" href="index.html"><span class="mark">DE</span> <div class="logo-text">DigiEdge<span class="ltag">Silicon to Intelligence</span></div></a>
    <nav>
      <a href="blog.html">← Back to blog</a>
      <a href="shop.html">Shop</a>
    </nav>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
      <a class="icon-btn" href="shop.html" title="Cart">🛒<span class="cart-badge"></span></a>
    </div>
  </div>
</header>

<section>
  <div class="wide">
    <div id="notFound" class="empty-note" style="display:none;">
      Couldn't find that post. <a href="blog.html">Back to the blog</a>.
    </div>
    <div id="postWrap" style="display:none;">
      <div class="post-meta-row">
        <span class="cat-badge" id="pCategory"></span>
        <span id="pAuthor"></span>
        <span>·</span>
        <span id="pDate"></span>
      </div>
      <div class="cat-pills page-nav" id="pageNav"></div>
      <div class="markdown-body" id="pBody"><div class="skeleton">Loading…</div></div>
      <div class="post-nav-links" id="postNavLinks"></div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-bottom">
    <div>&copy; 2026 DigiEdge.</div>
    <div><a href="blog.html">Back to the blog</a></div>
  </div>
</footer>

<script src="js/firebase-config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/whatsapp.js"></script>
<script src="js/blog-posts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function(){
  "use strict";

  var params = new URLSearchParams(window.location.search);
  var slug = params.get('slug');
  var post = slug && window.getLocalPost(slug);

  if(!post){
    document.getElementById('notFound').style.display = 'block';
    return;
  }

  var pages = post.pages || [{ title: post.title, file: post.file }];
  var pageNum = parseInt(params.get('page'), 10) || 1;
  if(pageNum < 1) pageNum = 1;
  if(pageNum > pages.length) pageNum = pages.length;
  var current = pages[pageNum - 1];

  document.title = (post.pages ? post.title + ' — ' + current.title : post.title) + ' | DigiEdge';
  document.getElementById('postWrap').style.display = 'block';
  document.getElementById('pCategory').textContent = post.category;
  document.getElementById('pAuthor').textContent = post.author;
  document.getElementById('pDate').textContent = new Date(post.date).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });

  function pageUrl(n){ return 'post.html?slug=' + encodeURIComponent(slug) + '&amp;page=' + n; }

  if(post.pages){
    document.getElementById('pageNav').innerHTML = pages.map(function(p, i){
      return '<a class="cat-pill' + (i + 1 === pageNum ? ' active' : '') + '" href="' + pageUrl(i + 1) + '">' +
        (i + 1) + '. ' + p.title + '</a>';
    }).join('');

    var navLinks = document.getElementById('postNavLinks');
    var prevHtml = pageNum > 1
      ? '<a href="' + pageUrl(pageNum - 1) + '">◀ ' + pages[pageNum - 2].title + '</a>'
      : '<span class="disabled">◀ Previous</span>';
    var nextHtml = pageNum < pages.length
      ? '<a href="' + pageUrl(pageNum + 1) + '">' + pages[pageNum].title + ' ▶</a>'
      : '<span class="disabled">Next ▶</span>';
    navLinks.innerHTML = prevHtml + nextHtml;
  }

  var baseDir = current.file.slice(0, current.file.lastIndexOf('/') + 1);
  var bodyEl = document.getElementById('pBody');

  fetch(current.file).then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.text();
  }).then(function(md){
    md = md.split('src="images/').join('src="' + baseDir + 'images/')
           .split('](images/').join('](' + baseDir + 'images/')
           .split('](files/').join('](' + baseDir + 'files/');
    bodyEl.innerHTML = marked.parse(md);
  }).catch(function(err){
    bodyEl.innerHTML = '<div class="empty-note">Couldn\'t load this post: ' + (err.message || err) + '</div>';
  });
})();
</script>
</body>
</html>
